name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'ios/**'
      - '.github/workflows/ios-unsigned.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "dev"
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Prepare (core, pods, codegen)
        run: |
          make ios-prepare

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build-ios.log
          ls -la build/ios/iphoneos/

      - name: Collect logs on failure
        if: always()
        run: |
          ls -la build/ios 2>/dev/null || true
          tail -c 200000 build-ios.log > build-ios-tail.log || true

      - name: Package unsigned .ipa
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Hiddify-iOS-unsigned.ipa Payload
          ls -la Hiddify-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hiddify-iOS-unsigned-ipa
          path: Hiddify-iOS-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build-ios-tail.log
          retention-days: 14
          if-no-files-found: ignore
